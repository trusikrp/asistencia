<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Gestor de Asistencia Docente</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px}
:root{
  --navy:#0f172a;--nav2:#1d4ed8;--nav3:#3b82f6;--sky:#eff6ff;--sky2:#dbeafe;
  --ok:#059669;--okb:#ecfdf5;--ok2:#10b981;
  --warn:#d97706;--wb:#fffbeb;
  --red:#dc2626;--rb:#fef2f2;
  --bg:#f8fafc;--bg2:#f1f5f9;--sfc:#ffffff;--sfc2:#f8fafc;
  --tx:#0f172a;--t2:#475569;--t3:#94a3b8;
  --bdr:#e2e8f0;--bdr2:#cbd5e1;
  --r6:8px;--r8:10px;--r10:12px;--r14:16px;--r18:20px;
  --sh1:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--sh2:0 4px 12px rgba(0,0,0,.08);--sh3:0 10px 24px rgba(0,0,0,.12);
  --sw:300px
}
body{background:var(--bg);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;overflow:hidden}
#toasts{position:fixed;top:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--r10);font-size:13px;font-weight:600;color:#fff;min-width:180px;max-width:300px;box-shadow:var(--sh3);pointer-events:all;animation:tIn .22s ease}
.t-ok{background:#27ae60}.t-err{background:#c0392b}.t-info{background:var(--nav3)}
@keyframes tIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
/* AUTH */
.auth-bg{display:flex;align-items:center;justify-content:center;min-height:100dvh;background:linear-gradient(135deg,#0d2444 0%,#1a5276 65%,#2878c4 100%);padding:20px}
.auth-card{background:#fff;border-radius:var(--r18);padding:30px 26px 26px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.auth-logo{text-align:center;margin-bottom:22px}
.auth-ico{font-size:48px;line-height:1}
.auth-title{font-size:21px;font-weight:800;color:var(--navy);margin-top:8px}
.auth-sub{font-size:12px;color:var(--t2);margin-top:2px}
.tab-row{display:flex;background:var(--sfc2);border-radius:var(--r10);padding:3px;margin-bottom:20px}
.tpill{flex:1;border:none;background:transparent;border-radius:var(--r8);padding:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--t2);transition:all .15s;font-family:inherit}
.tpill.on{background:#fff;color:var(--navy);box-shadow:var(--sh1)}
label.lbl{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.6px;text-transform:uppercase;display:block;margin-bottom:4px;margin-top:12px}
.inp{width:100%;border:1.5px solid var(--bdr);border-radius:var(--r8);padding:10px 12px;font-size:14px;color:var(--tx);outline:none;background:#fff;font-family:inherit;transition:border-color .15s;display:block}
.inp:focus{border-color:var(--nav3);box-shadow:0 0 0 3px rgba(40,120,196,.12)}
select.inp{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--r8);padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
.btn-pri{background:var(--nav2);color:#fff}.btn-pri:hover{background:var(--navy)}
.btn-pri.full{width:100%;margin-top:14px}
.btn-sec{background:var(--sky);color:var(--nav2)}.btn-sec:hover{background:var(--sky2)}
.btn-ok{background:var(--okb);color:var(--ok);border:1px solid #b2ddc4}.btn-ok:hover{background:#d4f0e0}
.btn-red{background:var(--rb);color:var(--red);border:1px solid #f5c2bc}.btn-red:hover{background:#f9d5d1}
.btn-ghost{background:var(--sfc2);color:var(--tx);border:1px solid var(--bdr)}.btn-ghost:hover{background:var(--bg2)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:var(--r6)}
.btn-dis{opacity:.4;cursor:not-allowed;pointer-events:none}
.lnk{background:none;border:none;color:var(--nav3);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;font-family:inherit}
.errmsg{background:var(--rb);color:var(--red);border-radius:var(--r8);padding:9px 12px;font-size:13px;margin:8px 0}
.okmsg{background:var(--okb);color:var(--ok);border-radius:var(--r8);padding:9px 12px;font-size:13px;margin:8px 0}
.rcode-wrap{background:var(--sky);border:1px solid var(--sky2);border-radius:var(--r10);padding:14px;text-align:center;margin:12px 0}
.rcode{font-size:26px;font-weight:900;letter-spacing:4px;color:var(--navy);margin:4px 0}
.divider{display:flex;align-items:center;gap:10px;color:var(--t3);font-size:12px;margin:14px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--bdr)}
.auth-footer{text-align:center;margin-top:12px;font-size:12px;color:var(--t2)}

.pw-wrap{position:relative;display:block}
.pw-wrap .inp{padding-right:42px}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;color:var(--t2);padding:4px;line-height:1;user-select:none}
.sort-bar{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--sfc);border-bottom:1px solid var(--bdr);flex-shrink:0;font-size:12px;color:var(--t2)}
.sort-btn{border:1.5px solid var(--bdr);background:var(--sfc2);color:var(--t2);border-radius:var(--r6);padding:4px 10px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .14s}
.sort-btn.on{background:var(--sky);color:var(--nav2);border-color:var(--sky2)}
.sort-btn:hover{border-color:var(--bdr2);background:var(--bg2)}
/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}
.sdb{width:100%;flex-shrink:0;background:linear-gradient(180deg,#1e293b 0%,#0f172a 100%);display:flex;flex-direction:column;overflow:hidden}
.main{display:none;flex:1;flex-direction:column;overflow:hidden;background:var(--bg)}
.layout.home .sdb{display:flex}.layout.home .main{display:none}
.layout.crs .sdb{display:none}.layout.crs .main{display:flex}
@media(min-width:700px){
  .layout.home .sdb,.layout.crs .sdb{display:flex;width:var(--sw)}
  .layout.home .main,.layout.crs .main{display:flex}
  .btnback{display:none!important}
}
/* SIDEBAR */
.sb-hdr{padding:14px 12px 10px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.sb-brand{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.sb-title{font-size:14px;font-weight:800;color:#fff}
.sb-ver{font-size:10px;color:rgba(255,255,255,.45);margin-top:1px}
.sb-user-row{display:flex;align-items:center;justify-content:space-between}
.sb-user{font-size:12px;color:rgba(255,255,255,.75)}
.sync-badge{font-size:10px;font-weight:700;border-radius:5px;padding:2px 7px}
.sync-ok{background:rgba(39,174,96,.25);color:#7de0a8}
.sync-ing{background:rgba(255,200,50,.2);color:#ffd580}
.sync-err{background:rgba(192,57,43,.3);color:#f39090}
.sync-off{background:rgba(255,255,255,.08);color:rgba(255,255,255,.35)}
.sb-acts{display:flex;gap:5px;padding:8px 10px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-act{flex:1;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.85);border-radius:var(--r6);padding:7px 4px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;text-align:center}
.sb-act:hover{background:rgba(255,255,255,.2)}
.sb-act:disabled{opacity:.35;cursor:not-allowed}
.sb-section{font-size:10px;font-weight:700;color:rgba(255,255,255,.38);letter-spacing:.8px;padding:10px 12px 3px;text-transform:uppercase;flex-shrink:0}
.sb-list{flex:1;overflow-y:auto;padding:4px 8px 12px}
.sb-list::-webkit-scrollbar{width:3px}.sb-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.cc{display:flex;align-items:flex-start;gap:7px;border-radius:var(--r10);margin-bottom:5px;padding:10px 9px 10px 11px;cursor:pointer;border:1px solid transparent;transition:all .12s}
.cc:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
.cc.active{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25)}
.cc-body{flex:1;min-width:0}
.cc-name{font-weight:700;font-size:13px;color:#fff;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-meta{font-size:11px;color:rgba(255,255,255,.5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:5px}
.cc-chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700}
.chip-b{background:rgba(255,255,255,.12);color:rgba(255,255,255,.8)}
.chip-d{background:rgba(255,255,255,.06);color:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.12)}
.cc-btns{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.ccbtn{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.75);border-radius:var(--r6);padding:4px 8px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .12s}
.ccbtn:hover{background:rgba(255,255,255,.22)}
.ccbtn.del{background:rgba(192,57,43,.25);color:#f39090}
.ccbtn.del:hover{background:rgba(192,57,43,.45)}
.sb-warn{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.3);border-radius:var(--r8);margin:4px 8px 6px;padding:8px 10px;font-size:11px;color:#f8c0b8;line-height:1.4}
.sb-empty{padding:32px 16px;text-align:center}
.sb-empty-ico{font-size:36px;margin-bottom:8px}
.sb-empty-ttl{font-size:14px;font-weight:700;color:rgba(255,255,255,.6);margin-bottom:4px}
.sb-empty-sub{font-size:11px;color:rgba(255,255,255,.38);line-height:1.5}
/* MAIN */
.mhdr{background:var(--nav2);color:#fff;padding:12px 14px 10px;flex-shrink:0}
.btnback{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:var(--r6);padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer;margin-bottom:5px;display:inline-block;font-family:inherit}
.m-name{font-size:17px;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-meta{font-size:11px;opacity:.75;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar{display:flex;background:var(--navy);flex-shrink:0;overflow-x:auto;border-bottom:2px solid rgba(255,255,255,.07)}
.tabbar::-webkit-scrollbar{display:none}
.tabbtn{flex:1;min-width:56px;background:transparent;border:none;border-bottom:3px solid transparent;color:rgba(255,255,255,.42);padding:9px 4px;cursor:pointer;font-size:9.5px;font-weight:600;letter-spacing:.2px;font-family:inherit;margin-bottom:-2px;white-space:nowrap;transition:all .14s}
.tabbtn.on{color:#fff;border-bottom-color:#fff;font-weight:700}
.tabbtn-ico{display:block;font-size:15px;margin-bottom:2px}
.tc{flex:1;overflow-y:auto;background:var(--bg)}
.tc::-webkit-scrollbar{width:5px}.tc::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:5px}
/* ATTENDANCE */
.att-top{display:flex;align-items:flex-start;gap:10px;padding:12px;background:var(--sfc);border-bottom:1px solid var(--bdr);flex-shrink:0}
.att-lbl{font-size:10px;font-weight:700;color:var(--t2);letter-spacing:.6px;text-transform:uppercase;display:block;margin-bottom:3px}
.date-inp{border:none;background:transparent;font-size:17px;font-weight:800;color:var(--nav2);outline:none;cursor:pointer;font-family:inherit}
.day-badge{background:var(--sky);color:var(--nav2);border-radius:var(--r6);padding:2px 8px;font-size:11.5px;font-weight:700}
.hoy-btn{background:#eff6ff;color:#1d4ed8;border:1.5px solid #93c5fd;border-radius:8px;padding:2px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1.6;display:inline-flex;align-items:center;gap:4px;transition:background .15s}
.hoy-btn:hover{background:#dbeafe}
.manual-badge{background:#fffbeb;color:#d97706;border:1px solid #fcd34d;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;letter-spacing:.3px;display:inline-flex;align-items:center;gap:3px}
.cnt-block{text-align:center;min-width:62px}
.cnt-val{font-size:22px;font-weight:900;line-height:1;color:var(--nav3)}
.cnt-done{color:var(--ok2)}
.done-badge{font-size:10px;font-weight:700;color:var(--ok);background:var(--okb);border-radius:5px;padding:2px 7px;margin-top:3px;display:inline-block}
.srch-wrap{padding:8px 12px;background:var(--sfc);border-bottom:1px solid var(--bdr);flex-shrink:0;display:flex;gap:6px;align-items:center}
.srch{flex:1;border:1.5px solid var(--bdr);border-radius:var(--r8);padding:7px 11px;font-size:13px;outline:none;background:#fff;color:var(--tx);font-family:inherit;transition:border-color .15s}
.srch:focus{border-color:var(--nav3)}
.qrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px;flex-shrink:0}
.qbox{background:var(--sfc);border-radius:var(--r10);padding:8px 10px;border:1px solid var(--bdr)}
.qlbl{font-size:9.5px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-bottom:5px}
.qbtns{display:flex;gap:4px}
.qb{flex:1;border:none;border-radius:var(--r6);padding:7px 3px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.qb-p{background:var(--ok2);color:#fff}.qb-a{background:var(--rb);color:var(--red)}
.chdr{display:flex;padding:4px 11px 2px;border-bottom:1px solid var(--bdr)}
.chn{width:22px;font-size:10px;font-weight:700;color:var(--t3)}
.chnm{flex:1;font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px}
.chh{width:44px;text-align:center;font-size:10px;font-weight:700;color:var(--t2)}
.slist{padding:5px 8px 14px}
.srow{background:var(--sfc);border-radius:var(--r10);padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;border-left:3px solid var(--bdr);border-right:1px solid var(--bdr);border-top:1px solid var(--bdr);border-bottom:1px solid var(--bdr);box-shadow:var(--sh1);transition:box-shadow .15s}
.snum{width:20px;font-size:10px;color:var(--t3);font-weight:700;text-align:center;flex-shrink:0}
.sinf{flex:1;min-width:0}
.sap{font-weight:700;font-size:13.5px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snm{font-size:11px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<body>
<div id="toasts"></div>
<div id="app"></div>
<script>
// ===== CONSTANTS =====
const TODAY = new Date().toISOString().split('T')[0];
const DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MAX_COURSES = 10;
const PFX = 'ga3_';
const JBIN = 'https://api.jsonbin.io/v3';

// ===== TOAST =====
function toast(msg, type, dur) {
  type = type || 'info';
  dur = dur || 3200;
  const box = document.getElementById('toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast t-' + type;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function() {
    el.style.opacity = '0';
    el.style.transition = 'opacity .3s';
    setTimeout(function() { el.remove(); }, 300);
  }, dur);
}

// ===== STORAGE =====
const DB = {
  get: function(k) {
    try { var v = localStorage.getItem(PFX + k); return v ? JSON.parse(v) : null; }
    catch(e) { return null; }
  },
  set: function(k, v) {
    try { localStorage.setItem(PFX + k, JSON.stringify(v)); }
    catch(e) { toast('Error al guardar datos.', 'err'); }
  },
  del: function(k) {
    try { localStorage.removeItem(PFX + k); }
    catch(e) {}
  }
};

// ===== UTILS =====
function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function norm(s) {
  return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function fmtDate(d) {
  if (!d) return '';
  var p = d.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
function fmtDateS(d) {
  if (!d) return '';
  var p = d.split('-');
  return p[2] + '/' + p[1];
}
function dayName(d) {
  if (!d) return '';
  return DAYS[new Date(d + 'T12:00:00').getDay()];
}
function pctColor(p) {
  if (p === null || p === undefined) return '#aaa';
  if (p >= 75) return '#27ae60';
  if (p >= 50) return '#e67e22';
  return '#c0392b';
}
function genId() {
  return 'i' + Date.now() + Math.random().toString(36).slice(2, 6);
}
function sortStudents(arr) {
  var by = (S && S.sortBy) ? S.sortBy : 'apellido';
  return arr.slice().sort(function(a, b) {
    var r;
    if (by === 'nombre') {
      r = norm(a.nombre).localeCompare(norm(b.nombre));
      if (r !== 0) return r;
      return norm(a.apellido).localeCompare(norm(b.apellido));
    }
    r = norm(a.apellido).localeCompare(norm(b.apellido));
    if (r !== 0) return r;
    return norm(a.nombre).localeCompare(norm(b.nombre));
  });
}
function buildSortBar() {
  var by = S.sortBy;
  return '<div class="sort-bar">Ordenar: ' +
    '<button class="sort-btn' + (by==='apellido'?' on':'') + '" data-sortby="apellido">Apellido ↑</button>' +
    '<button class="sort-btn' + (by==='nombre'?' on':'') + '" data-sortby="nombre">Nombre ↑</button>' +
    '<span style="margin-left:auto;font-size:11px;color:var(--t3)">' +
    (by==='apellido'?'A–Z por apellido':'A–Z por nombre') + '</span>' +
    '</div>';
}
function pwField(id, placeholder, autocomplete) {
  var ac = autocomplete ? ' autocomplete="' + autocomplete + '"' : '';
  return '<div class="pw-wrap"><input class="inp" id="' + id + '" type="password" placeholder="' + placeholder + '"' + ac + '/>' +
    '<button class="pw-eye" data-pw="' + id + '" type="button" title="Mostrar/ocultar contraseña">👁</button></div>';
}
function parseName(line, fmt) {
  var t = (line || '').trim();
  if (!t) return null;
  var ap, nm;
  if (t.indexOf(',') >= 0) {
    var parts = t.split(',');
    ap = parts[0].trim();
    nm = parts.slice(1).join(',').trim();
    if (fmt === 'nm_ap') { var tmp = ap; ap = nm; nm = tmp; }
  } else {
    var words = t.split(/\s+/);
    if (words.length < 2) return null;
    if (fmt === 'nm_ap') {
      nm = words[0];
      ap = words.slice(1).join(' ');
    } else {
      ap = words[0];
      nm = words.slice(1).join(' ');
    }
  }
  if (!ap || !nm) return null;
  var cap = function(s) { return s.charAt(0).toUpperCase() + s.slice(1); };
  return { ap: cap(ap.trim()), nm: cap(nm.trim()) };
}
function calcStats(students, sessions) {
  var dates = Object.keys(sessions);
  var total = dates.length * 2;
  return students.map(function(s) {
    var p = 0, a = 0;
    dates.forEach(function(d) {
      var at = (sessions[d] || {})[s.id] || { h1: null, h2: null };
      if (at.h1 === 'P') p++; else if (at.h1 === 'A') a++;
      if (at.h2 === 'P') p++; else if (at.h2 === 'A') a++;
    });
    var pct = total > 0 ? Math.round(p / total * 100) : null;
    return Object.assign({}, s, { p: p, a: a, total: total, pct: pct });
  });
}
function getAtt(sessions, sid, h, d) {
  var day = sessions[d] || {};
  var stu = day[sid] || {};
  var v = stu[h];
  return (v === undefined || v === null) ? null : v;
}
function cap1(s) {
  if (!s) return '';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// ===== AUTH =====
function hashPwd(u, p) {
  return btoa(encodeURIComponent(u.toLowerCase() + ':ga3:' + p + ':v3'));
}
function genCode() {
  return (Math.random().toString(36).slice(2, 6) + Math.random().toString(36).slice(2, 6)).toUpperCase();
}
function getUsers() { return DB.get('users') || []; }
function saveUsers(u) { DB.set('users', u); }
function getCurrentUser() {
  var id = DB.get('sess');
  if (!id) return null;
  return getUsers().find(function(u) { return u.id === id; }) || null;
}
function doLogin(uname, pwd) {
  var h = hashPwd(uname, pwd);
  var users = getUsers();
  var u = users.find(function(x) { return x.uname.toLowerCase() === uname.toLowerCase() && x.ph === h; });
  if (!u) return { ok: false, msg: 'Usuario o contraseña incorrectos.' };
  DB.set('sess', u.id);
  return { ok: true, user: u };
}
function doRegister(uname, pwd, email, secQ, secA) {
  var users = getUsers();
  if (users.find(function(x) { return x.uname.toLowerCase() === uname.toLowerCase(); })) {
    return { ok: false, msg: 'El nombre de usuario ya existe.' };
  }
  if (uname.length < 3) return { ok: false, msg: 'El usuario debe tener al menos 3 caracteres.' };
  if (pwd.length < 4) return { ok: false, msg: 'La contraseña debe tener al menos 4 caracteres.' };
  var code = genCode();
  var u = { id: genId(), uname: uname, email: email||"", ph: hashPwd(uname, pwd), secQ: secQ, secA: norm(secA), rc: code, created: TODAY };
  users.push(u);
  saveUsers(users);
  DB.set('sess', u.id);
  return { ok: true, user: u, code: code };
}
function doRecover(uname, method, val, newPwd) {
  var users = getUsers();
  var idx = users.findIndex(function(x) { return x.uname.toLowerCase() === uname.toLowerCase(); });
  if (idx < 0) return { ok: false, msg: 'Usuario no encontrado.' };
  var u = users[idx];
  if (method === 'code' && val.toUpperCase() !== u.rc) return { ok: false, msg: 'Código incorrecto.' };
  if (method === 'email') { if (!u.email) return { ok: false, msg: 'Este usuario no tiene correo electrónico registrado.' }; if (norm(val) !== norm(u.email)) return { ok: false, msg: 'El correo electrónico no coincide con el registrado.' }; return { ok: 'email_ok', code: u.rc, user: u }; }
  if (method === 'sec' && norm(val) !== u.secA) return { ok: false, msg: 'Respuesta incorrecta.' };
  if (newPwd.length < 4) return { ok: false, msg: 'La contraseña debe tener al menos 4 caracteres.' };
  users[idx] = Object.assign({}, u, { ph: hashPwd(uname, newPwd) });
  saveUsers(users);
  return { ok: true };
}
function doLogout() { DB.del('sess'); }

// ===== CLOUD SYNC =====
var CL = {
  key: null, binId: null, status: 'off', timer: null,
  init: function() {
    var cfg = DB.get('cloud') || {};
    this.key = cfg.key || null;
    this.binId = cfg.binId || null;
    this.status = (this.key && this.binId) ? 'ok' : 'off';
  },
  isOk: function() { return !!(this.key && this.binId); },
  doPush: function() {
    if (!this.isOk()) return;
    var self = this;
    if (self.timer) clearTimeout(self.timer);
    self.timer = setTimeout(function() {
      self.status = 'ing'; self.updateBadge();
      var data = self.collect();
      fetch(JBIN + '/b/' + self.binId, {
        method: 'PUT',
        headers: { 'X-Master-Key': self.key, 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).then(function(r) {
        self.status = r.ok ? 'ok' : 'err';
        self.updateBadge();
      }).catch(function() {
        self.status = 'err';
        self.updateBadge();
      });
    }, 2000);
  },
  doPull: function(cb) {
    if (!this.isOk()) { if (cb) cb(null); return; }
    var self = this;
    self.status = 'ing'; self.updateBadge();
    fetch(JBIN + '/b/' + self.binId + '/latest', {
      headers: { 'X-Master-Key': self.key }
    }).then(function(r) {
      if (!r.ok) { self.status = 'err'; self.updateBadge(); if (cb) cb(null); return; }
      return r.json();
    }).then(function(j) {
      if (!j) return;
      self.status = 'ok'; self.updateBadge();
      if (cb) cb(j.record || j);
    }).catch(function() {
      self.status = 'err'; self.updateBadge(); if (cb) cb(null);
    });
  },
  doCreate: function(key, cb) {
    var self = this;
    var u = getCurrentUser();
    var data = self.collect();
    fetch(JBIN + '/b', {
      method: 'POST',
      headers: { 'X-Master-Key': key, 'Content-Type': 'application/json', 'X-Bin-Name': 'Asistencia-' + (u ? u.uname : 'doc') },
      body: JSON.stringify(data)
    }).then(function(r) {
      if (!r.ok) { if (cb) cb(null, 'Error al crear bin. Verificá la clave API.'); return; }
      return r.json();
    }).then(function(j) {
      if (!j) return;
      var bid = (j.metadata && j.metadata.id) ? j.metadata.id : j.id;
      if (cb) cb(bid, null);
    }).catch(function(e) {
      if (cb) cb(null, e.message);
    });
  },
  collect: function() {
    var u = getCurrentUser();
    var courses = getCourses();
    var sessions = {};
    courses.forEach(function(c) { sessions[c.id] = DB.get('sess_' + c.id) || {}; });
    return { v: 3, ts: new Date().toISOString(), uid: u ? u.id : null, uname: u ? u.uname : null, courses: courses, sessions: sessions };
  },
  updateBadge: function() {
    var el = document.getElementById('sync-badge');
    if (!el) return;
    var map = {
      ok: { cls: 'sync-ok', txt: '☁ Sincronizado' },
      ing: { cls: 'sync-ing', txt: '↻ Sincronizando' },
      err: { cls: 'sync-err', txt: '✕ Error sync' },
      off: { cls: 'sync-off', txt: '☁ Sin nube' }
    };
    var m = map[this.status] || map.off;
    el.className = 'sync-badge ' + m.cls;
    el.textContent = m.txt;
  }
};

// ===== DATA ACCESS =====
function uid() {
  var u = getCurrentUser();
  return u ? u.id : '?';
}
function getCourses() {
  var all = DB.get('courses') || [];
  var myId = uid();
  return all.filter(function(c) { return c.uid === myId; });
}
function saveCourses(courses) {
  var all = DB.get('courses') || [];
  var myId = uid();
  var others = all.filter(function(c) { return c.uid !== myId; });
  DB.set('courses', others.concat(courses));
  CL.doPush();
}
function getSessions(cid) {
  return DB.get('sess_' + cid) || {};
}
function saveSessions(cid, s) {
  DB.set('sess_' + cid, s);
  CL.doPush();
}
function lastSessionDate(cid) {
  var dates = Object.keys(DB.get('sess_' + cid) || {}).sort();
  return dates.length ? dates[dates.length - 1] : null;
}

// ===== FOCUS PRESERVATION =====
var _fid = null, _fss = null, _fse = null;
function saveFocus() {
  var el = document.activeElement;
  if (el && el.id) {
    _fid = el.id;
    try { _fss = el.selectionStart; _fse = el.selectionEnd; } catch(e) { _fss = _fse = null; }
  } else { _fid = null; }
}
function restoreFocus() {
  if (!_fid) return;
  var el = document.getElementById(_fid);
  if (!el) { _fid = null; return; }
  el.focus();
  if (_fss !== null) { try { el.setSelectionRange(_fss, _fse); } catch(e) {} }
  _fid = null;
}

// ===== RENDER MAIN =====
function render() {
  saveFocus();
  var root = document.getElementById('app');
  if (S.scr === 'auth') {
    root.innerHTML = buildAuth();
    bindAuth();
    setTimeout(restoreFocus, 0);
    return;
  }
  var html = buildLayout();
  if (S.showCF) html += buildCFModal();
  if (S.showSF) html += buildSFModal();
  if (S.showImp) html += buildImpModal();
  if (S.showCloud) html += buildCloudModal();
  if (S.showData) html += buildDataModal();
  var _tcEl=document.querySelector('.tc'),_tcST=_tcEl?_tcEl.scrollTop:0;
  root.innerHTML = html;
  var _tcN=document.querySelector('.tc');if(_tcN&&_tcST)_tcN.scrollTop=_tcST;
  bindApp();
  setTimeout(function() { restoreFocus(); CL.updateBadge(); }, 0);
}

function bindAuth() {
  function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  function enter(ids, btnId) {
    ids.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('keydown', function(e) { if (e.key === 'Enter') { var b = document.getElementById(btnId); if (b) b.click(); } });
    });
  }
  document.querySelectorAll('[data-atab]').forEach(function(b) {
    b.addEventListener('click', function() { S.atab = b.dataset.atab; S.aerr = ''; S.amsg = ''; S.rcode = ''; render(); });
  });
  on('btn-login', function() {
    var u = val('l-u').trim(), p = val('l-p');
    if (!u || !p) { S.aerr = 'Completá todos los campos.'; render(); return; }
    var r = doLogin(u, p);
    if (!r.ok) { S.aerr = r.msg; render(); return; }
    initApp();
  });
  on('btn-toforgot', function() { S.atab = 'forgot'; S.aerr = ''; S.amsg = ''; S.rStep = 1; render(); });
  on('btn-tologin', function() { S.atab = 'login'; S.aerr = ''; S.amsg = ''; render(); });
  on('btn-tocloud', function() { S.atab = 'cloud'; S.aerr = ''; S.amsg = ''; render(); });
  on('btn-reg', function() {
    var SQS = ['¿Nombre de tu primera mascota?','¿Ciudad donde naciste?','¿Nombre de tu escuela primaria?','¿Color favorito de la infancia?','¿Apellido materno de tu madre?'];
    var u = val('r-u').trim(), p = val('r-p'), p2 = val('r-p2'), em = val('r-email').trim(), sqIdx = val('r-sq'), sa = val('r-sa').trim();
    if (!u || !p || !p2 || !sa) { S.aerr = 'Completá todos los campos.'; render(); return; }
    if (p !== p2) { S.aerr = 'Las contraseñas no coinciden.'; render(); return; }
    var r = doRegister(u, p, em, SQS[parseInt(sqIdx) || 0], sa);
    if (!r.ok) { S.aerr = r.msg; render(); return; }
    S.rcode = r.code; render();
  });
  on('btn-enterapp', function() { S.rcode = ''; initApp(); });
  on('btn-fnext', function() {
    var u = val('f-u').trim(), mt = val('f-mt') || 'code';
    if (!u) { S.aerr = 'Ingresá tu usuario.'; render(); return; }
    var found = getUsers().find(function(x) { return x.uname.toLowerCase() === u.toLowerCase(); });
    if (!found) { S.aerr = 'Usuario no encontrado.'; render(); return; }
    S.rUser = u; S.rMethod = mt; S.rStep = 2; S.aerr = ''; render();
    if (mt === 'sec') {
      var el = document.getElementById('f-v');
      if (el) el.placeholder = found.secQ || 'Tu respuesta';
    }
    if (mt === 'email') {
      var el2 = document.getElementById('f-v');
      if (el2) el2.placeholder = 'correo@ejemplo.com';
    }
  });
  on('btn-freset', function() {
    var v = val('f-v').trim(), np = val('f-np');
    if (!v || !np) { S.aerr = 'Completá todos los campos.'; render(); return; }
    var r = doRecover(S.rUser, S.rMethod, v, np);
    if (r.ok === 'email_ok') { S.amsg = '✅ Correo verificado. Tu código de recuperación es: ' + r.code + '. Úlalo en el campo de código.'; S.rMethod = 'code'; S.rStep = 2; render(); return; }
    if (!r.ok) { S.aerr = r.msg; render(); return; }
    S.atab = 'login'; S.rStep = 1; S.aerr = ''; S.amsg = 'Contraseña restablecida. Ya podés iniciar sesión.'; render();
  });
  on('btn-cl-restore', function() {
    var key = val('cl-key').trim(), bid = val('cl-bid').trim();
    if (!key || !bid) { S.aerr = 'Completá ambos campos.'; render(); return; }
    S.aerr = ''; S.amsg = 'Conectando...'; render();
    CL.key = key; CL.binId = bid;
    CL.doPull(function(data) {
      if (!data || !data.courses) { S.amsg = ''; S.aerr = 'No se pudo conectar o el bin no contiene datos válidos.'; render(); return; }
      var allC = DB.get('courses') || [];
      data.courses.forEach(function(c) {
        var idx = allC.findIndex(function(x) { return x.id === c.id; });
        if (idx >= 0) allC[idx] = c; else allC.push(c);
      });
      DB.set('courses', allC);
      Object.keys(data.sessions || {}).forEach(function(cid) { DB.set('sess_' + cid, data.sessions[cid]); });
      var users = getUsers();
      var u = users.find(function(x) { return x.uname === data.uname; });
      if (!u) {
        var code = genCode();
        u = { id: data.uid || genId(), uname: data.uname, ph: '?', secQ: 'Código de restauración', secA: norm(code), rc: code, created: TODAY };
        users.push(u); saveUsers(users);
        DB.set('cloud', { key: key, binId: bid });
        S.amsg = ''; S.atab = 'login';
        S.aerr = 'Datos restaurados. Usuario: "' + data.uname + '". En este dispositivo nuevo, restablecé tu contraseña con el código: ' + code;
        render(); return;
      }
      DB.set('sess', u.id);
      DB.set('cloud', { key: key, binId: bid });
      initApp();
    });
  });
  // pw-eye toggles (auth)
  document.querySelectorAll('[data-pw]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var inp = document.getElementById(btn.dataset.pw);
      if (!inp) return;
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? '👁' : '🙈';
    });
  });
  enter(['l-u','l-p'], 'btn-login');
  enter(['r-u','r-p','r-p2','r-sa'], 'btn-reg');
}

// ===== ATTENDANCE TAB =====

function buildAttTab(c, sessions) {
  var selDate = S.selDate, search = S.search;
  var students = sortStudents(c.students || []);
  var cur = sessions[selDate] || {};
  var mc = students.filter(function(s) {
    var a = cur[s.id];
    return a && (a.h1 !== null || a.h2 !== null);
  }).length;
  var allDone = mc === students.length && students.length > 0;
  var q = norm(search);
  var filt = q ? students.filter(function(s) {
    return norm(s.apellido + ' ' + s.nombre + ' ' + (s.dni || '')).indexOf(q) >= 0;
  }) : students;

      '<button id="btn-save-day" style="font-size:11px;padding:4px 10px;border-radius:7px;border:1px solid rgba(40,167,69,.5);background:rgba(40,167,69,.12);color:#28a745;cursor:pointer">💾 Guardar cambios</button>' +
      '</div>';
  } else if (isPastDay && !isRegisteredDay) {
    editingNotice = '<div style="margin:8px 0;padding:8px 14px;background:rgba(100,149,237,.09);border:1px solid rgba(100,149,237,.3);border-radius:10px;font-size:12px;color:var(--t2)">📅 Registrando asistencia para una fecha pasada.</div>';
  }

  var tema = meta.tema || '';

    '<label>📍 Modalidad:</label>' +
    '<button class="modalidad-btn' + (modalidad === 'presencial' ? ' active-pres' : '') + '" id="btn-mod-pres" data-mod="presencial">🏫 Presencial</button>' +
    '<button class="modalidad-btn' + (modalidad === 'virtual' ? ' active-virt' : '') + '" id="btn-mod-virt" data-mod="virtual">💻 Virtual</button>' +

  var temaBar = '<div class="tema-bar">' +
    '<label>📚 Tema:</label>' +
    '<input class="tema-input" id="tema-input" type="text" placeholder="Escribí el tema de la clase..." value="' + esc(tema) + '" autocomplete="off"/>' +
    '<button class="tema-save-btn" id="btn-save-tema">💾 Guardar</button>' +
    '</div>';
  var h = '<div class="att-top">' +
    '<div style="flex:1"><span class="att-lbl">Fecha de clase</span>' +
    '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
    '<input type="date" class="date-inp" id="date-inp" value="' + selDate + '"/>' +
    '<span class="day-badge">' + dayName(selDate) + '</span>' +
    (S.selDate !== TODAY ? '<button id="btn-hoy" class="hoy-btn">↩ Hoy</button>' : '') +
    (S.selDate !== TODAY ? '<span class="manual-badge">📅 Fecha manual</span>' : '') +
    '</div></div>' +
    '<div class="cnt-block">' +
    '<span class="att-lbl" style="display:block;text-align:center">Registros</span>' +
    '<div class="cnt-val' + (allDone ? ' cnt-done' : '') + '">' + mc + '/' + students.length + '</div>' +
    (allDone ? '<div class="done-badge">✓ Completo</div>' : '') +
    '</div></div>' +
    editingNotice +
    modalidadBar +
    temaBar +
    '<div class="srch-wrap">' +
    '<input class="srch" id="srch" type="text" placeholder="🔎 Buscar por apellido, nombre o DNI..." value="' + esc(search) + '" autocomplete="off" spellcheck="false"/>' +
    (search ? '<button class="btn btn-ghost btn-sm" id="btn-clrsrch">✕</button>' : '') +
    '</div>' +
    '<div class="qrow">' +
    '<div class="qbox"><div class="qlbl">Hora 1 — todos</div><div class="qbtns"><button class="qb qb-p" data-qh="h1" data-qv="P">✓ Presentes</button><button class="qb qb-a" data-qh="h1" data-qv="A">✗ Ausentes</button></div></div>' +
    '<div class="qbox"><div class="qlbl">Hora 2 — todos</div><div class="qbtns"><button class="qb qb-p" data-qh="h2" data-qv="P">✓ Presentes</button><button class="qb qb-a" data-qh="h2" data-qv="A">✗ Ausentes</button></div></div>' +

  if (!students.length) {

      var h2 = getAtt(sessions, s.id, 'h2', selDate);
      var bc = (h1==='P'&&h2==='P') ? 'var(--ok2)' : (h1==='A'||h2==='A') ? 'var(--red)' : 'var(--bdr)';

        '</div>' +
        '<button class="abtn abtn-' + (h1||'N') + '" data-sid="' + s.id + '" data-h="h1">' + (h1||'·') + '</button>' +
        '<button class="abtn abtn-' + (h2||'N') + '" data-sid="' + s.id + '" data-h="h2">' + (h2||'·') + '</button>' +
        '</div>';
    });
  }
  h += '</div><div class="lgnd">' +
    '<span>Toque para marcar:</span>' +
    '<span><span class="ld" style="background:var(--ok2)">P</span> Presente</span>' +

}

function buildStatsTab(c, sessions, sortedDates) {
  var tn = Object.keys(sessions).length, tc2 = tn * 2;
  var stats = calcStats(sortStudents(c.students || []), sessions);
  var h = '<div class="hero">' +
    '<div class="hero-lbl">' + esc(c.name) + '</div>' +
    '<div class="hero-grid">' +
    '<div class="hero-it"><div class="hero-num">' + tc2 + '</div><div class="hero-sub">Clases dictadas</div></div>' +
    '<div class="hero-it"><div class="hero-num">' + tn + '</div><div class="hero-sub">Días</div></div>' +
    '<div class="hero-it"><div class="hero-num">' + (c.students || []).length + '</div><div class="hero-sub">Alumnos/as</div></div>' +
    '</div></div>' +
    '<div class="ri"><span>ℹ️</span><span><b style="color:var(--tx)">Regularidad:</b> <span style="color:var(--ok2)">● ≥75%</span> Regular · <span style="color:var(--warn)">● 50–74%</span> En riesgo · <span style="color:var(--red)">● &lt;50%</span> Irregular</span></div>';
  if (!stats.length) {
    h += '<div class="mempty">Sin alumnos registrados.</div>';
  } else {
    stats.forEach(function(s) {
      var col = pctColor(s.pct);
      var isExp = S.expSt === s.id;
      var pctTxt = s.pct !== null ? s.pct + '%' : '—';
      h += '<div class="stc">' +
        '<div class="str" data-exp="' + s.id + '">' +
        '<div class="stnm">' + esc(s.apellido) + ', ' + esc(s.nombre) + '</div>' +
        '<div class="stnums">' +
        '<div class="si"><div class="sl">PRES</div><div class="sv sv-ok">' + s.p + '</div></div>' +
        '<div class="si"><div class="sl">AUS</div><div class="sv sv-no">' + s.a + '</div></div>' +
        '<div class="pctb" style="background:' + col + '">' + pctTxt + '</div>' +
        '<div class="chev' + (isExp ? ' chev-open' : '') + '">▾</div>' +
        '</div></div>' +
        '<div class="pb"><div class="pf" style="width:' + (s.pct || 0) + '%;background:' + col + '"></div></div>' +
        (isExp ? buildHistPanel(s, sessions, sortedDates) : '') +
        '</div>';
    });
  }
  return h;
}
function buildHistPanel(s, sessions, sortedDates) {
  var h = '<div class="histp"><div class="histl">Historial · ' + s.total + ' horas dictadas</div>';
  if (!sortedDates.length) {
    h += '<div style="font-size:12px;color:var(--t2)">Sin clases registradas.</div>';
  } else {
    sortedDates.forEach(function(d) {
      var at = (sessions[d] || {})[s.id] || { h1: null, h2: null };
      h += '<div class="hrow"><div class="hdt">' + dayName(d) + ' ' + fmtDate(d) + '</div><div class="hcells">';
      ['h1','h2'].forEach(function(hr) {
        var v = at[hr];
        var bg = v==='P' ? 'var(--ok2)' : v==='A' ? 'var(--red)' : 'var(--sfc2)';
        var fc = v ? '#fff' : 'var(--t3)';
        h += '<span class="hcell" style="background:' + bg + ';color:' + fc + '">' + (v || '·') + '</span>';
      });
      h += '</div></div>';
    });
  }
  h += '</div>';
  return h;
}

// ===== TABLERO =====
function buildTablero(c, sessions, sortedDates) {
  var students = sortStudents(c.students || []);
  var allDates = Object.keys(sessions).sort();
  if (!students.length) return '<div class="empt"><div class="empt-ico">📊</div><div class="empt-ttl">Sin alumnos</div><div class="empt-sub">Agregá alumnos para ver el tablero.</div></div>';
  if (!allDates.length) return '<div class="empt"><div class="empt-ico">🗓</div><div class="empt-ttl">Sin clases registradas</div><div class="empt-sub">Tomá asistencia primero.</div></div>';
  var stats = calcStats(students, sessions);
  var sm = {};
  stats.forEach(function(s) { sm[s.id] = s; });
  var h = '<div style="padding:8px 10px 4px;font-size:12px;color:var(--t2)">Clases: <b style="color:var(--tx)">' + allDates.length*2 + '</b> · Días: <b style="color:var(--tx)">' + allDates.length + '</b> · Alumnos: <b style="color:var(--tx)">' + students.length + '</b></div>';
  h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="stky" rowspan="2">Apellido y Nombre</th>';
  allDates.forEach(function(d) {
    h += '<th colspan="2" style="white-space:nowrap">' + dayName(d) + '<br>' + fmtDateS(d) + '<br><button class="btn btn-sec btn-sm" data-editday="' + d + '" style="font-size:10px;padding:2px 7px;margin-top:3px;background:rgba(255,165,0,.18);color:#ffa500;border:1px solid rgba(255,165,0,.4)">✏ Editar</button></th>';
  });
  h += '<th colspan="2" style="background:#0d2444">Totales</th><th style="background:#0d2444">%</th></tr><tr>';
  allDates.forEach(function() { h += '<th>H1</th><th>H2</th>'; });
  h += '<th>P</th><th>A</th><th></th></tr></thead><tbody>';
  students.forEach(function(s) {
    var ss = sm[s.id];
    var pc = pctColor(ss.pct);
    h += '<tr><td class="stky">' + esc(s.apellido) + ', ' + esc(s.nombre) + '</td>';
    allDates.forEach(function(d) {
      var at = (sessions[d] || {})[s.id] || { h1: null, h2: null };
      ['h1','h2'].forEach(function(hr) {
        var v = at[hr];
        h += '<td class="' + (v==='P'?'cp':v==='A'?'ca':'cn') + '">' + (v||'·') + '</td>';
      });
    });
    var pctTxt = ss.pct !== null ? ss.pct + '%' : '—';
    h += '<td class="ctot">' + ss.p + '</td><td class="ctot">' + ss.a + '</td><td class="cpct" style="color:' + pc + '">' + pctTxt + '</td></tr>';
  });
  h += '<tr class="tsum"><td class="stky" style="color:var(--ok2)">↑ Total presentes</td>';
  allDates.forEach(function(d) {
    var cur = sessions[d] || {};
    ['h1','h2'].forEach(function(hr) {
      var cnt = students.filter(function(s) { return ((cur[s.id]||{})[hr]) === 'P'; }).length;
      h += '<td class="cp">' + cnt + '</td>';
    });
  });
  h += '<td colspan="3"></td></tr>';
  h += '<tr class="tsum"><td class="stky" style="color:var(--red)">↓ Total ausentes</td>';
  allDates.forEach(function(d) {
    var cur = sessions[d] || {};
    ['h1','h2'].forEach(function(hr) {
      var cnt = students.filter(function(s) { return ((cur[s.id]||{})[hr]) === 'A'; }).length;
      h += '<td class="ca">' + cnt + '</td>';
    });
  });
  h += '<td colspan="3"></td></tr>';
  h += '</tbody></table></div>';
  return h;
}

// ===== ACTIONS =====
function toggleAtt(sid, hora) {
  var cid = S.selC, d = S.selDate;
  var sess = getSessions(cid);
  if (!sess[d]) sess[d] = {};
  if (!sess[d][sid]) sess[d][sid] = { h1: null, h2: null };
  var cur = sess[d][sid][hora];
  sess[d][sid][hora] = (cur === null) ? 'P' : (cur === 'P') ? 'A' : null;
  saveSessions(cid, sess);
  render();
}
function markAll(hora, val) {
  var cid = S.selC, d = S.selDate, c = getCourse();
  if (!c) return;
  var sess = getSessions(cid);
  if (!sess[d]) sess[d] = {};
  (c.students || []).forEach(function(s) {
    if (!sess[d][s.id]) sess[d][s.id] = { h1: null, h2: null };
    sess[d][s.id][hora] = val;
  });
  saveSessions(cid, sess);
  render();
}
function saveCourse() {
  var cf = S.cf;
  if (!cf.name.trim()) { toast('El nombre del espacio es obligatorio.', 'err'); return; }
  var courses = getCourses();
  if (S.editCI) {
    courses = courses.map(function(c) {
      return c.id === S.editCI ? Object.assign({}, c, { name: cf.name.trim(), inst: cf.inst.trim(), teacher: cf.teacher.trim(), year: cf.year.trim() }) : c;
    });
    toast('Espacio actualizado.', 'ok');
  } else {
    if (courses.length >= MAX_COURSES) { toast('Límite de ' + MAX_COURSES + ' espacios alcanzado.', 'err'); return; }
    var nc = { id: genId(), uid: uid(), name: cf.name.trim(), inst: cf.inst.trim(), teacher: cf.teacher.trim(), year: cf.year.trim(), students: [] };
    courses.push(nc);
    S.selC = nc.id; S.view = 'crs'; S.tab = 'alumnos';
    toast('Espacio creado. Agregá los alumnos.', 'ok');
  }
  saveCourses(courses);
  S.courses = getCourses();
  S.showCF = false; S.editCI = null; S.cf = { name:'', inst:'', teacher:'', year:'' };
  render();
}
function saveStudent() {
  var sf = S.sf, mode = S.sfMode;
  var fap, fnm;
  if (mode === 'single') {
    var parsed = parseName(sf.full, sf.fmt);
    if (!parsed) { toast('No se pudo interpretar el nombre. Usá una coma para separar apellido y nombre.', 'err'); return; }
    fap = parsed.ap; fnm = parsed.nm;
  } else {
    fap = sf.ap.trim(); fnm = sf.nm.trim();
    if (!fap || !fnm) { toast('Apellido y nombre son obligatorios.', 'err'); return; }
    fap = cap1(fap); fnm = cap1(fnm);
  }
  var dni = (sf.dni || '').trim();
  var courses = getCourses();
  var idx = courses.findIndex(function(c) { return c.id === S.selC; });
  if (idx < 0) return;
  if (S.editSI !== null) {
    courses[idx].students = (courses[idx].students || []).map(function(s) {
      return s.id === S.editSI ? Object.assign({}, s, { apellido: fap, nombre: fnm, dni: dni }) : s;
    });
    toast('Alumno/a actualizado/a.', 'ok');
  } else {
    if ((courses[idx].students || []).length >= 100) { toast('Límite de 100 alumnos alcanzado.', 'err'); return; }
    var sts = courses[idx].students || [];
    var maxId = sts.length ? Math.max.apply(null, sts.map(function(s) { return s.id; })) : 0;
    sts.push({ id: maxId + 1, apellido: fap, nombre: fnm, dni: dni });
    courses[idx].students = sts;
    toast(fap + ', ' + fnm + ' agregado/a.', 'ok');
  }
  saveCourses(courses);
  S.courses = getCourses();
  S.showSF = false; S.editSI = null; S.sf = { ap:'', nm:'', dni:'', fmt:'ap_nm', full:'' }; S.sfMode = 'fields';
  render();
}
function doImport() {
  var imp = S.imp;
  var lines = imp.txt.split('\n');
  var added = 0, skipped = 0;
  var courses = getCourses();
  var idx = courses.findIndex(function(c) { return c.id === S.selC; });
  if (idx < 0) return;
  var students = courses[idx].students || [];
  lines.forEach(function(line) {
    if (students.length >= 100) { skipped++; return; }
    var parsed = parseName(line, imp.fmt);
    if (!parsed) { if (line.trim()) skipped++; return; }
    var maxId = students.length ? Math.max.apply(null, students.map(function(s) { return s.id; })) : 0;
    students.push({ id: maxId + 1, apellido: parsed.ap, nombre: parsed.nm, dni: '' });
    added++;
  });
  courses[idx].students = students;
  saveCourses(courses);
  S.courses = getCourses();
  S.showImp = false; S.imp = { txt:'', fmt:'ap_nm' };
  toast(added + ' alumno/as importados.' + (skipped ? ' ' + skipped + ' líneas omitidas.' : ''), added ? 'ok' : 'err');
  render();
}
function deleteStudent(id) {
  var courses = getCourses();
  var idx = courses.findIndex(function(c) { return c.id === S.selC; });
  if (idx < 0) return;
  var s = (courses[idx].students || []).find(function(x) { return x.id === id; });
  courses[idx].students = (courses[idx].students || []).filter(function(x) { return x.id !== id; });
  var sess = getSessions(S.selC);
  Object.keys(sess).forEach(function(d) { if (sess[d][id]) delete sess[d][id]; });
  saveSessions(S.selC, sess);
  saveCourses(courses);
  S.courses = getCourses();
  S.delSt = null;
  toast((s ? s.apellido : 'Alumno/a') + ' eliminado/a.', 'info');
  render();
}
function deleteCourse(id) {
  var courses = getCourses();
  var c = courses.find(function(x) { return x.id === id; });
  courses = courses.filter(function(x) { return x.id !== id; });
  DB.del('sess_' + id);
  saveCourses(courses);
  S.courses = getCourses();
  if (S.selC === id) { S.selC = null; S.view = 'home'; }
  S.delCo = null;
  toast('Espacio "' + (c ? c.name : '') + '" eliminado.', 'info');
  render();
}
function exportData() {
  var u = getCurrentUser(), courses = getCourses(), sessions = {};
  courses.forEach(function(c) { sessions[c.id] = DB.get('sess_' + c.id) || {}; });
  var data = { v: 3, exportDate: TODAY, uid: u ? u.id : null, uname: u ? u.uname : null, courses: courses, sessions: sessions };
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = 'asistencia_' + (u ? u.uname : 'datos') + '_' + TODAY + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Datos exportados.', 'ok');
}
function importData() {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = function(e) {
    var file = e.target.files[0]; if (!file) return;
    var r = new FileReader();
    r.onload = function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (!data.courses) throw new Error('Archivo inválido.');
        if (!confirm('Importar ' + data.courses.length + ' espacios de "' + (data.uname || 'usuario') + '"? Los datos existentes con el mismo ID se actualizarán.')) return;
        var all = DB.get('courses') || [];
        var myId = uid();
        data.courses.forEach(function(ic) {
          var merged = Object.assign({}, ic, { uid: myId });
          var i = all.findIndex(function(x) { return x.id === ic.id; });
          if (i >= 0) all[i] = merged; else all.push(merged);
        });
        DB.set('courses', all);
        Object.keys(data.sessions || {}).forEach(function(cid) { DB.set('sess_' + cid, data.sessions[cid]); });
        S.courses = getCourses();
        toast(data.courses.length + ' espacios importados.', 'ok');
        render();
      } catch(err) { toast('Error al leer el archivo: ' + err.message, 'err'); }
    };
    r.readAsText(file);
  };
  inp.click();
}

function getPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
  if (window.jsPDF) return window.jsPDF;
  return null;
}
function pdfCheck() {
  if (!getPDF()) { toast('Librería PDF no cargada. Conectate a internet e intentá de nuevo.', 'err'); return false; }
  return true;

function showPDFPreview(pdfDataUri, filename) {
  var existing = document.getElementById('pdf-preview-modal');
  if (existing) existing.remove();
  var modal = document.createElement('div');
  modal.id = 'pdf-preview-modal';
  modal.className = 'pdf-modal-overlay';
  modal.innerHTML =
    '<div class="pdf-modal">' +
      '<div class="pdf-modal-header">' +
        '<span class="pdf-modal-title">📄 Vista previa: ' + filename + '</span>' +
        '<div class="pdf-modal-actions">' +
          '<button class="pdf-dl-btn" id="pdf-dl-confirm">⬇ Descargar PDF</button>' +
          '<button class="pdf-close-btn" id="pdf-preview-close">✕ Cerrar</button>' +
        '</div>' +
      '</div>' +
      '<div class="pdf-frame-wrap">' +
        '<iframe class="pdf-frame" src="' + pdfDataUri + '#toolbar=1&navpanes=0"></iframe>' +
      '</div>' +
    '</div>';
  document.body.appendChild(modal);
  document.getElementById('pdf-preview-close').addEventListener('click', function() { modal.remove(); });
  document.getElementById('pdf-dl-confirm').addEventListener('click', function() {
    var a = document.createElement('a');
    a.href = pdfDataUri;
    a.download = filename;
    a.click();
    modal.remove();
    toast('PDF descargado.', 'ok');
  });
  modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });
  document.addEventListener('keydown', function escH(e) {
    if (e.key === 'Escape') { modal.remove(); document.removeEventListener('keydown', escH); }
  });
}

H1','

H2');

function bindApp() {
  function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
  function onall(sel, fn) { document.querySelectorAll(sel).forEach(function(el) { el.addEventListener('click', fn); }); }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  function enterKey(ids, btnId) {
    ids.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('keydown', function(e) { if (e.key === 'Enter') { var b = document.getElementById(btnId); if (b) b.click(); } });
    });
  }

  on('btn-logout', function() {
    if (confirm('¿Cerrar sesión?')) { doLogout(); S.scr = 'auth'; S.atab = 'login'; S.aerr = ''; render(); }
  });
  on('btn-nc', function() { S.showCF = true; S.editCI = null; S.cf = { name:'', inst:'', teacher:'', year:'' }; render(); });
  on('btn-back', function() { S.view = 'home'; render(); });
  on('btn-cloud-cfg', function() { S.showCloud = true; render(); });
  on('btn-data-cfg', function() { S.showData = true; render(); });

  onall('[data-copen]', function(e) {
    var id = e.currentTarget.dataset.copen;
    S.selC = id; S.view = 'crs'; S.tab = 'asistencia'; S.search = ''; render();
  });
  onall('[data-edc]', function(e) {
    e.stopPropagation();
    var id = e.currentTarget.dataset.edc;
    var c = S.courses.find(function(x) { return x.id === id; });
    if (!c) return;
    S.editCI = id; S.showCF = true;
    S.cf = { name: c.name, inst: c.inst||'', teacher: c.teacher||'', year: c.year||'' };
    render();
  });
  onall('[data-dc]', function(e) { e.stopPropagation(); S.delCo = e.currentTarget.dataset.dc; render(); });
  onall('[data-dcyes]', function(e) { e.stopPropagation(); deleteCourse(e.currentTarget.dataset.dcyes); });
  onall('[data-dcno]', function(e) { e.stopPropagation(); S.delCo = null; render(); });

  onall('[data-tab]', function(e) { S.tab = e.currentTarget.dataset.tab; S.search = ''; render(); });

  var di = document.getElementById('date-inp');
  if (di) di.addEventListener('change', function(e) { S.selDate = e.target.value; render(); });
  var bh = document.getElementById('btn-hoy');
  if (bh) bh.addEventListener('click', function() { S.selDate = TODAY; render(); });
  var si = document.getElementById('srch');
  if (si) si.addEventListener('input', function(e) { S.search = e.target.value; render(); });
  on('btn-clrsrch', function() { S.search = ''; render(); });

  onall('[data-qh]', function(e) { markAll(e.currentTarget.dataset.qh, e.currentTarget.dataset.qv); });
  onall('[data-sid]', function(e) {
    var sid = parseInt(e.currentTarget.dataset.sid, 10);
    var h = e.currentTarget.dataset.h;
    toggleAtt(sid, h);
  });
  onall('[data-exp]', function(e) {
    var id = parseInt(e.currentTarget.dataset.exp, 10);
    S.expSt = (S.expSt === id) ? null : id; render();
  });

  on('btn-as', function() { S.showSF = true; S.editSI = null; S.sfMode = 'fields'; S.sf = { ap:'', nm:'', dni:'', fmt:'ap_nm', full:'' }; render(); });
  onall('[data-del]', function(e) { S.delSt = parseInt(e.currentTarget.dataset.del, 10); render(); });
  onall('[data-dno]', function() { S.delSt = null; render(); });
  onall('[data-dyes]', function(e) { deleteStudent(parseInt(e.currentTarget.dataset.dyes, 10)); });
  onall('[data-eds]', function(e) {
    var id = parseInt(e.currentTarget.dataset.eds, 10);
    var c = getCourse();
    var s = (c ? c.students || [] : []).find(function(x) { return x.id === id; });
    if (!s) return;
    S.editSI = id; S.showSF = true; S.sfMode = 'fields';
    S.sf = { ap: s.apellido, nm: s.nombre, dni: s.dni||'', fmt:'ap_nm', full:'' };
    render();
  });
  on('btn-imp', function() { S.showImp = true; S.imp = { txt:'', fmt:'ap_nm' }; render(); });

  // Course form
  on('btn-ccnl', function() { S.showCF = false; S.editCI = null; render(); });
  on('btn-csav', function() {
    S.cf.name = val('cf-n'); S.cf.inst = val('cf-i'); S.cf.teacher = val('cf-t'); S.cf.year = val('cf-y');
    saveCourse();
  });
  ['cf-n','cf-i','cf-t','cf-y'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('keydown', function(e) { if (e.key === 'Enter') { var b = document.getElementById('btn-csav'); if (b) b.click(); } });
  });

  // Student form
  on('sf-mode-f', function() { S.sfMode = 'fields'; render(); });
  on('sf-mode-s', function() { S.sfMode = 'single'; render(); });
  on('btn-swap', function() {
    var parsed = parseName(S.sf.full, S.sf.fmt);
    if (!parsed) return;
    S.sf.full = parsed.nm + ', ' + parsed.ap;
    S.sf.fmt = S.sf.fmt === 'ap_nm' ? 'nm_ap' : 'ap_nm';
    render();
  });
  var sfFullEl = document.getElementById('sf-full');
  if (sfFullEl) sfFullEl.addEventListener('input', function(e) { S.sf.full = e.target.value; render(); });
  var sfFmtEl = document.getElementById('sf-fmt');
  if (sfFmtEl) sfFmtEl.addEventListener('change', function(e) { S.sf.fmt = e.target.value; render(); });
  ['sf-a','sf-n','sf-d'].forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', function(e) {
      if (id==='sf-a') S.sf.ap = e.target.value;
      else if (id==='sf-n') S.sf.nm = e.target.value;
      else if (id==='sf-d') S.sf.dni = e.target.value;
    });
    el.addEventListener('keydown', function(e) { if (e.key==='Enter') { var b=document.getElementById('btn-ssav'); if(b)b.click(); } });
  });
  on('btn-scnl', function() { S.showSF = false; S.editSI = null; render(); });
  on('btn-ssav', function() {
    if (S.sfMode === 'fields') {
      S.sf.ap = val('sf-a'); S.sf.nm = val('sf-n');
    } else {
      S.sf.full = val('sf-full'); S.sf.fmt = val('sf-fmt') || 'ap_nm';
    }
    S.sf.dni = val('sf-d');
    saveStudent();
  });

  // Import
  on('btn-icnl', function() { S.showImp = false; render(); });
  on('btn-isav', function() {
    S.imp.txt = val('imp-txt'); S.imp.fmt = val('imp-fmt') || 'ap_nm';
    doImport();
  });
  var imptxt = document.getElementById('imp-txt');
  if (imptxt) imptxt.addEventListener('input', function(e) { S.imp.txt = e.target.value; });
  var impfmt = document.getElementById('imp-fmt');
  if (impfmt) impfmt.addEventListener('change', function(e) { S.imp.fmt = e.target.value; });

  // Cloud modal
  on('btn-clcnl', function() { S.showCloud = false; render(); });
  on('btn-cl-dis', function() {
    if (!confirm('¿Desactivar la sincronización en la nube?')) return;
    DB.del('cloud'); CL.key = null; CL.binId = null; CL.status = 'off';
    S.showCloud = false; toast('Nube desconectada.', 'info'); render();
  });
  on('btn-clsav', function() {
    var key = val('cl-key').trim(), bid = val('cl-bid').trim();
    if (!key) { toast('Ingresá tu Master Key de JSONBin.io.', 'err'); return; }
    var btnEl = document.getElementById('btn-clsav');
    if (btnEl) btnEl.textContent = '⏳ Conectando...';
    CL.key = key;
    if (bid) {
      CL.binId = bid; CL.status = 'ing';
      var data = CL.collect();
      fetch(JBIN + '/b/' + bid, {
        method: 'PUT',
        headers: { 'X-Master-Key': key, 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).then(function(r) {
        if (r.ok) {
          DB.set('cloud', { key: key, binId: bid });
          CL.binId = bid; CL.status = 'ok';
          S.showCloud = false; toast('¡Nube conectada! Bin: ' + bid.slice(0,8) + '...', 'ok'); render();
        } else {
          CL.status = 'err'; toast('No se pudo conectar. Verificá la clave y el ID del bin.', 'err'); render();
        }
      }).catch(function(e) { CL.status = 'err'; toast('Error: ' + e.message, 'err'); render(); });
    } else {
      CL.doCreate(key, function(newBid, errMsg) {
        if (errMsg || !newBid) { CL.status = 'err'; toast(errMsg || 'No se pudo crear el bin.', 'err'); render(); return; }
        DB.set('cloud', { key: key, binId: newBid });
        CL.key = key; CL.binId = newBid; CL.status = 'ok';
        S.showCloud = false; toast('¡Nube creada! Bin ID: ' + newBid, 'ok'); render();
      });
    }
  });

  // Data modal
  on('btn-data-cnl', function() { S.showData = false; render(); });
  on('btn-exp-do', function() { exportData(); S.showData = false; render(); });
  on('btn-imp-do', function() { importData(); S.showData = false; render(); });

  // PDF
  on('btn-pdf-cls', function() { var c = getCourse(); if (c) generateClassPDF(c); });
  on('btn-pdf-stu', function() {
    var c = getCourse(), sel = val('rep-stu');
    if (!sel) { toast('Seleccioná un alumno/a primero.', 'err'); return; }
    if (c) generateStudentPDF(c, parseInt(sel, 10));
  });
  on('btn-pdf-dni', function() { var c = getCourse(); if (c) generateRosterPDF(c); });

  // Edit day from tablero board
  document.querySelectorAll('[data-editday]').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      var d = e.currentTarget.dataset.editday;
      S.selDate = d; S.tab = 'asistencia'; render();
    });
  });
  // Delete day button in attendance view
  var btnDelDay = document.getElementById('btn-del-day');
  if (btnDelDay) {
    btnDelDay.addEventListener('click', function() {
      var cid = S.selC, d = S.selDate;
      var dFmt = fmtDateS(d) + ' (' + dayName(d) + ')';
      if (!confirm('¿Eliminar todos los registros de asistencia del ' + dFmt + '?\n\nEsta acción no se puede deshacer.')) return;
      var sess = getSessions(cid);
      delete sess[d];
      saveSessions(cid, sess);
      toast('Registros del ' + dFmt + ' eliminados.', 'ok');
      S.selDate = TODAY; render();
    });
  }
    // Sort toggle
  onall('[data-sortby]', function(e) { S.sortBy = e.currentTarget.dataset.sortby; render(); });
  // Overlay close
  var ovl = document.getElementById('ovl');
  if (ovl) ovl.addEventListener('click', function(e) {
    if (e.target === ovl) {
      S.showCF = S.showSF = S.showImp = S.showCloud = S.showData = false;
      S.editCI = S.editSI = null;
      render();
    }
  });
  // Modalidad buttons (Presencial/Virtual)
  document.querySelectorAll('.modalidad-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var mod = btn.dataset.mod;
      var cid2 = S.selC, d2 = S.selDate;
      var sess = getSessions(cid2);
      if (!sess[d2]) sess[d2] = {};
      if (!sess[d2]._meta) sess[d2]._meta = {};
      sess[d2]._meta.modalidad = mod;
      saveSessions(cid2, sess);
      toast((mod === 'presencial' ? '🏫 Presencial' : '💻 Virtual') + ' guardado', 'ok');
      render();
    });
  });
  // Tema save button
  var temaSaveBtn = document.getElementById('btn-save-tema');
  if (temaSaveBtn) {
    temaSaveBtn.addEventListener('click', function() {
      var cid2 = S.selC, d2 = S.selDate;
      var temaVal = (document.getElementById('tema-input') || {}).value || '';
      var sess = getSessions(cid2);
      if (!sess[d2]) sess[d2] = {};
      if (!sess[d2]._meta) sess[d2]._meta = {};
      sess[d2]._meta.tema = temaVal;
      saveSessions(cid2, sess);
      toast('📚 Tema guardado', 'ok');
    });
  }
  // Tema input Enter key
  var temaInputEl = document.getElementById('tema-input');
  if (temaInputEl) {
    temaInputEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var cid2 = S.selC, d2 = S.selDate;
        var sess = getSessions(cid2);
        if (!sess[d2]) sess[d2] = {};
        if (!sess[d2]._meta) sess[d2]._meta = {};
        sess[d2]._meta.tema = temaInputEl.value;
        saveSessions(cid2, sess);
        toast('📚 Tema guardado', 'ok');
      }
    });
  }

}

// ===== INIT =====

function loadPDF() {
  if (getPDF()) return;
  var s1 = document.createElement('script');
  s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  s1.onload = function() {
    var s2 = document.createElement('script');
    s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
    document.head.appendChild(s2);
  };
  document.head.appendChild(s1);
}

function initApp() {
  CL.init();
  S.scr = 'app';
  S.courses = getCourses();
  loadPDF();
  render();
}

// Start
(function() {
  var u = getCurrentUser();
  if (u) { initApp(); }
  else { S.scr = 'auth'; render(); }
})();
</script>
</body>
</html>
